services:
  db:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
      args:
        POSTGRES_IMAGE: postgres:18.6-trixie

  migrate:
    build:
      context: .
      dockerfile: apps/server/Dockerfile

  api:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      NODE_ENV: development
      APP_ORIGIN: ${BFW_APP_ORIGIN:-http://localhost:${BFW_WEB_PORT:-8080}}

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      APP_DOMAIN: ":80"
    ports: !override
      - "127.0.0.1:${BFW_WEB_PORT:-8080}:80"
